<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>QA — layout desktop 1440px</title>
    <style>
      html, body { margin: 0; padding: 0; background: #ddd; }
      #stage { width: 720px; height: 7600px; transform: scale(0.5); transform-origin: top left; }
      iframe { width: 1440px; height: 15200px; border: 0; display: block; background: #fff; }
    </style>
  </head>
  <body>
    <div id="stage">
      <iframe id="site" src="/"></iframe>
    </div>
    <script>
      window.goTo = function (id) {
        var f = document.getElementById('site');
        var doc = f.contentDocument;
        var el = doc.getElementById(id);
        if (!el) return 'missing:' + id;
        var top = el.getBoundingClientRect().top + f.contentWindow.scrollY;
        window.scrollTo(0, Math.max(0, top * 0.5 - 40));
        return 'ok ' + id + ' @' + Math.round(top);
      };
      window.siteInfo = function () {
        var f = document.getElementById('site');
        var w = f.contentWindow;
        return { w: w.innerWidth, h: w.innerHeight, docH: f.contentDocument.body.scrollHeight };
      };
    </script>
  </body>
</html>
