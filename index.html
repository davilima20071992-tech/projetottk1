<!doctype html>
<html lang="pt-BR">
  <head>

    <!-- ============ SEO BÁSICO ============ -->
    <title>Lar Bom Samaritano — Cuidado, segurança e carinho para quem você ama</title>

    <meta name="author" content="Lar Bom Samaritano" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://seusite.com.br/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />

    <meta property="og:title" content="Lar Bom Samaritano — Um novo lar, com todo o carinho e cuidado que a sua família merece." />

    <meta property="og:image" content="images/hero-casal.jpg" />
    <meta property="og:url" content="https://seusite.com.br/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lar Bom Samaritano — Cuidado, segurança e carinho." />
    <meta
      name="twitter:description"
      content="Conheça nossa estrutura e agende uma visita sem compromisso."
    />
    <meta name="twitter:image" content="images/hero-casal.jpg" />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="favicon.svg" />

    <!-- ============ DADOS ESTRUTURADOS (JSON-LD) ============ -->
    <!-- Preencha os campos entre <> com os dados reais antes de publicar. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Lar Bom Samaritano",
        "description": "Residencial sênior com ambiente acolhedor, equipe preparada e atenção individualizada para idosos.",
        "url": "https://seusite.com.br/",
        "image": "https://seusite.com.br/images/hero-casal.jpg",
        "priceRange": "$$",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Rua das Acácias, 450",
          "addressLocality": "Campinas",
          "addressRegion": "SP",
          "postalCode": "13040-000",
          "addressCountry": "BR"
        },
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday"],
          "opens": "09:00",
          "closes": "17:00"
        }
      }
    </script>
